<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyderguda Post Office S.O. – Savings Schemes (Staging)</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body { font-family: Inter, sans-serif; }
  </style>
</head>

<body class="bg-slate-900 text-slate-100">

<div class="bg-yellow-100 text-yellow-900 text-center text-sm font-bold py-2 px-4">
  ⚠️ This is a TEST / STAGING website for internal review only.
</div>

<div x-data="postOfficeApp()" x-init="initApp()">

<header class="bg-slate-950 border-b border-white/10 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">INDIA POST</h1>
      <p class="text-xs tracking-widest font-semibold">HYDERGUDA S.O.</p>
    </div>
    <button @click="toggleLang()" class="text-xs px-3 py-1 border border-white/20 rounded">
      <span x-text="lang === 'en' ? 'ENG' : 'తెలుగు'"></span>
    </button>
  </div>
</header>

<section class="max-w-5xl mx-auto px-4 py-10 text-center">
  <span class="text-xs font-bold text-emerald-400" x-text="t('govt_backed')"></span>
  <h2 class="text-3xl font-extrabold mt-3" x-text="t('site_title')"></h2>
  <p class="text-slate-300 mt-2" x-text="t('site_subtitle')"></p>
</section>

<section class="max-w-5xl mx-auto px-4 pb-6 grid grid-cols-2 gap-3 text-sm">
  <a href="https://www.google.com/maps/search/?api=1&query=Hyderguda+Post+Office+Attapur"
     target="_blank"
     class="border border-white/10 rounded p-3 text-center">📍 Get Directions</a>

  <a href="tel:04029561505"
     class="border border-white/10 rounded p-3 text-center">☎ Call Post Office</a>
</section>

<main class="max-w-7xl mx-auto px-4 py-10">
  <h3 id="schemesSection"
      class="text-xl font-bold border-l-4 border-red-600 pl-3"
      x-text="t('our_schemes')"></h3>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
    <template x-for="scheme in schemes" :key="scheme.id">
      <div @click="openModal(scheme)"
           class="border border-white/10 rounded-xl p-5 cursor-pointer hover:bg-white/5">
        <h4 class="font-bold text-lg" x-text="scheme.title"></h4>
        <p class="text-sm text-slate-400" x-text="scheme.desc"></p>
      </div>
    </template>
  </div>
</main>

<!-- MODAL -->
<div x-show="isModalOpen" style="display:none"
     class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">

  <div class="bg-slate-900 max-w-lg w-full rounded-xl p-6 border border-white/10">
    <button @click="closeModal()" class="float-right">✕</button>

    <h3 class="text-xl font-bold mb-1" x-text="activeScheme?.title"></h3>
    <p class="text-sm text-slate-400 mb-2" x-text="activeScheme?.desc"></p>

    <p class="text-sm text-emerald-400 mb-4" x-text="activeScheme?.who"></p>

    <label class="text-xs font-semibold">
      <span x-text="activeScheme?.inputType === 'monthly'
        ? 'Monthly amount (₹)'
        : 'One-time amount (₹)'"></span>
    </label>

    <input type="number"
           x-model="userAmount"
           class="w-full mt-1 mb-3 p-2 rounded bg-slate-800 border border-white/10" />

    <p class="text-sm text-slate-300 mb-4"
       x-text="activeScheme?.message.replace('{amount}', '₹' + userAmount)"></p>

    <!-- WHATSAPP -->
    <a
      :href="`https://wa.me/919347133286?text=${encodeURIComponent(
        'Hello, I visited the Hyderguda Post Office website and would like clarification about the ' +
        activeScheme.title +
        ' account before visiting the post office.'
      )}`"
      target="_blank"
      class="block text-center bg-green-600 text-white py-2 rounded">
      💬 Ask before visiting (WhatsApp)
    </a>

    <p class="text-xs text-slate-400 mt-2">
      WhatsApp is only for general guidance. Account opening is done only at the Post Office.
    </p>
  </div>
</div>

</div>

<script>
function postOfficeApp() {
  return {
    lang: 'en',
    isModalOpen: false,
    activeScheme: null,
    userAmount: 0,

    schemes: [
      { id:'SCSS', title:'Senior Citizen Savings Scheme', desc:'Quarterly income scheme',
        who:'For citizens aged 60 years & above', inputType:'lump', defaultAmount:100000,
        message:'Investing around ₹{amount} can help generate regular income.' },

      { id:'SSY', title:'Sukanya Samriddhi Yojana', desc:'Savings for girl child',
        who:'For parents of a girl child below 10 years', inputType:'monthly', defaultAmount:1000,
        message:'Saving ₹{amount} every month helps build a secure future.' },

      { id:'PPF', title:'Public Provident Fund', desc:'Long-term tax-free savings',
        who:'For long-term savings and tax planning', inputType:'monthly', defaultAmount:1000,
        message:'Contributing ₹{amount} every month supports long-term savings.' },

      { id:'RD', title:'Recurring Deposit', desc:'Monthly savings scheme',
        who:'For disciplined monthly savings', inputType:'monthly', defaultAmount:1000,
        message:'Saving ₹{amount} every month builds strong saving habits.' }
    ],

    translations: {
      en: {
        govt_backed: "✔ Government of India Backed Savings Schemes",
        site_title: "India Post Savings Schemes",
        site_subtitle: "Understand schemes clearly and visit Hyderguda Post Office with confidence.",
        our_schemes: "Our Savings Schemes"
      },
      te: {
        govt_backed: "✔ ప్రభుత్వం మద్దతు ఉన్న పొదుపు పథకాలు",
        site_title: "ఇండియా పోస్ట్ సేవింగ్స్ పథకాలు",
        site_subtitle: "పథకాలను సులభంగా అర్థం చేసుకోండి",
        our_schemes: "మా పొదుపు పథకాలు"
      }
    },

    t(k){ return this.translations[this.lang][k] || k },
    toggleLang(){ this.lang = this.lang === 'en' ? 'te' : 'en' },

    openModal(s){
      this.activeScheme = s;
      this.userAmount = s.defaultAmount;
      this.isModalOpen = true;
      history.pushState({modal:true}, '');
    },

    closeModal(){
      this.isModalOpen = false;
      this.activeScheme = null;
      if(history.state?.modal) history.back();
    },

    initApp(){
      window.addEventListener('popstate',()=>{
        this.isModalOpen = false;
        this.activeScheme = null;
      });
    }
  }
}
</script>

</body>
</html>
