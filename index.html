<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyderguda Post Office S.O. – Savings Schemes (Staging)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style> body { font-family: Inter, sans-serif; } </style>
</head>

<body class="bg-slate-900 text-slate-100">

<div class="bg-yellow-100 text-yellow-900 text-center text-sm font-bold py-2 px-4">
  ⚠️ TEST / STAGING website – not for public use.
</div>

<div x-data="postOfficeApp()" x-init="initApp()">

<header class="bg-slate-950 border-b border-white/10 sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">INDIA POST</h1>
      <p class="text-xs tracking-widest font-semibold">HYDERGUDA S.O.</p>
    </div>
    <button @click="toggleLang()" class="text-xs px-3 py-1 border border-white/20 rounded">
      <span x-text="lang === 'en' ? 'ENG' : 'తెలుగు'"></span>
    </button>
  </div>
</header>

<!-- HERO -->
<section class="max-w-5xl mx-auto px-4 py-14 text-center">
  <span class="text-xs font-bold text-emerald-400" x-text="t('govt_backed')"></span>
  <h2 class="text-3xl font-extrabold mt-4" x-text="t('site_title')"></h2>
  <p class="text-slate-300 mt-2" x-text="t('site_subtitle')"></p>
</section>

<!-- UTILITIES -->
<section class="max-w-5xl mx-auto px-4 pb-10 grid grid-cols-2 gap-4 text-sm">
  <a href="https://www.google.com/maps/search/?api=1&query=Hyderguda+Post+Office+Attapur"
     target="_blank"
     class="border border-white/10 rounded-lg p-4 text-center">📍 Get Directions</a>

  <a href="tel:04029561505"
     class="border border-white/10 rounded-lg p-4 text-center">☎ Call Post Office</a>
</section>

<!-- CATEGORIES -->
<section class="max-w-6xl mx-auto px-4 pb-10">
  <p class="text-sm text-slate-400 mb-4 text-center">
    Choose a category to find suitable savings schemes
  </p>

  <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-sm">
    <template x-for="cat in categories" :key="cat.id">
      <div @click="toggleCategory(cat.id)"
           :class="activeCategory === cat.id ? 'border-red-500 bg-white/10' : 'border-white/10'"
           class="border rounded-lg p-4 text-center cursor-pointer">
        <div class="text-xl" x-text="cat.icon"></div>
        <div class="font-semibold" x-text="cat.label"></div>
        <div class="text-xs text-slate-400" x-text="cat.desc"></div>
      </div>
    </template>
  </div>
</section>

<!-- SCHEMES -->
<main class="max-w-6xl mx-auto px-4 pb-16">
  <h3 class="text-xl font-bold mb-6 border-l-4 border-red-600 pl-3">
    Our Savings Schemes
  </h3>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
    <template x-for="scheme in filteredSchemes()" :key="scheme.id">
      <div @click="openModal(scheme)"
           class="border border-white/10 rounded-xl p-6 cursor-pointer hover:bg-white/5">
        <h4 class="font-bold text-lg" x-text="scheme.title"></h4>
        <p class="text-sm text-slate-400" x-text="scheme.desc"></p>
      </div>
    </template>
  </div>
</main>

<!-- MODAL WITH CALCULATOR -->
<div x-show="isModalOpen" style="display:none"
     class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">

  <div class="bg-slate-900 max-w-lg w-full rounded-xl p-6 border border-white/10">
    <button @click="closeModal()" class="float-right text-slate-400">✕</button>

    <h3 class="text-xl font-bold" x-text="activeScheme?.title"></h3>
    <p class="text-sm text-slate-400 mb-2" x-text="activeScheme?.desc"></p>
    <p class="text-sm text-emerald-400 mb-4" x-text="activeScheme?.who"></p>

    <!-- CALCULATOR -->
    <label class="text-xs font-semibold mb-1 block">
      <span x-text="activeScheme?.inputType === 'monthly'
        ? t('monthly_amt')
        : t('lump_amt')"></span>
    </label>

    <input type="number"
           x-model.number="userAmount"
           class="w-full mb-3 p-2 rounded bg-slate-800 border border-white/10" />

    <div class="text-sm text-slate-300 mb-4"
         x-text="activeScheme?.message.replace('{amount}', '₹' + userAmount)">
    </div>

    <!-- WHATSAPP -->
    <a :href="`https://wa.me/919347133286?text=${encodeURIComponent(
      'I want guidance about the ' + activeScheme.title + ' scheme.'
    )}`"
       target="_blank"
       class="block bg-green-600 text-white text-center py-3 rounded-lg font-semibold">
      💬 Ask before visiting (WhatsApp)
    </a>

    <p class="text-xs text-slate-400 mt-3">
      For exact eligibility and account opening, please visit the Post Office.
    </p>
  </div>
</div>

</div>

<script>
function postOfficeApp() {
  return {
    lang:'en',
    isModalOpen:false,
    activeScheme:null,
    userAmount:1000,
    activeCategory:null,

    translations:{
      en:{
        govt_backed:"✔ Government of India Backed Savings Schemes",
        site_title:"India Post Savings Schemes",
        site_subtitle:"Understand schemes clearly and visit Hyderguda Post Office with confidence.",
        monthly_amt:"Monthly amount (₹)",
        lump_amt:"One-time amount (₹)"
      },
      te:{
        govt_backed:"✔ ప్రభుత్వం మద్దతు ఉన్న పొదుపు పథకాలు",
        site_title:"ఇండియా పోస్ట్ సేవింగ్స్ పథకాలు",
        site_subtitle:"పథకాలను సులభంగా అర్థం చేసుకొని పోస్టాఫీసును సందర్శించండి.",
        monthly_amt:"నెలవారీ మొత్తం (₹)",
        lump_amt:"ఒక్కసారి పెట్టే మొత్తం (₹)"
      }
    },

    categories:[
      {id:'senior', icon:'👴', label:'Senior Citizens', desc:'60 years & above'},
      {id:'girl', icon:'👧', label:'Girl Child', desc:'Daughter’s future'},
      {id:'income', icon:'💰', label:'Monthly Income', desc:'Regular income'},
      {id:'tax', icon:'🧾', label:'Tax Saving', desc:'Tax benefits'},
      {id:'general', icon:'🪙', label:'General Savings', desc:'Simple & safe'}
    ],

    schemes:[
      {id:'SCSS',category:'senior',title:'Senior Citizen Savings Scheme',desc:'Quarterly income scheme',who:'For age 60 years & above',inputType:'lump',message:'Investing {amount} helps generate regular income.'},
      {id:'SSY',category:'girl',title:'Sukanya Samriddhi Yojana',desc:'Savings for girl child',who:'For parents of a girl child',inputType:'monthly',message:'Saving {amount} every month builds your daughter’s future.'},
      {id:'MIS',category:'income',title:'Monthly Income Scheme',desc:'Fixed monthly income',who:'For regular monthly income',inputType:'lump',message:'Investment of {amount} provides monthly income.'},
      {id:'PPF',category:'tax',title:'Public Provident Fund',desc:'Long-term tax-free savings',who:'For long-term savings',inputType:'monthly',message:'Contributing {amount} monthly supports long-term savings.'},
      {id:'NSC',category:'tax',title:'National Savings Certificate',desc:'5-year fixed savings',who:'For safe fixed-term investment',inputType:'lump',message:'Depositing {amount} gives assured maturity.'},
      {id:'RD',category:'general',title:'Recurring Deposit',desc:'Monthly savings scheme',who:'For disciplined savings',inputType:'monthly',message:'Saving {amount} monthly builds discipline.'},
      {id:'TD',category:'general',title:'Time Deposit',desc:'Fixed deposit',who:'For guaranteed returns',inputType:'lump',message:'Depositing {amount} gives fixed returns.'},
      {id:'KVP',category:'general',title:'Kisan Vikas Patra',desc:'Amount doubles',who:'For long-term growth',inputType:'lump',message:'Depositing {amount} grows over time.'}
    ],

    t(k){ return this.translations[this.lang][k] || k },

    filteredSchemes(){
      if(!this.activeCategory) return this.schemes;
      return this.schemes.filter(s=>s.category===this.activeCategory);
    },

    toggleCategory(c){ this.activeCategory = this.activeCategory===c ? null : c },

    openModal(s){
      this.activeScheme=s;
      this.userAmount = s.inputType==='monthly' ? 1000 : 100000;
      this.isModalOpen=true;
    },

    closeModal(){ this.isModalOpen=false },

    toggleLang(){ this.lang=this.lang==='en'?'te':'en' },
    initApp(){}
  }
}
</script>

</body>
</html>
