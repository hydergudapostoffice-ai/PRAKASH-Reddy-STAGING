<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyderguda Post Office S.O. – Savings Schemes (Staging)</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>

  <style>
    body { font-family: Inter, sans-serif; }
  </style>
</head>

<body class="bg-slate-900 text-slate-100">

<!-- STAGING WARNING -->
<div class="bg-yellow-100 text-yellow-900 text-center text-sm font-bold py-2 px-4">
  ⚠️ This is a TEST / STAGING website for internal review only. Not for public use.
</div>

<div x-data="postOfficeApp()" x-init="initApp()">

  <!-- HEADER -->
  <header class="bg-slate-950 border-b border-white/10 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold">INDIA POST</h1>
        <p class="text-xs tracking-widest font-semibold">HYDERGUDA S.O.</p>
      </div>

      <button @click="toggleLang()"
              class="text-xs px-3 py-1 border border-white/20 rounded">
        <span x-text="lang === 'en' ? 'ENG' : 'తెలుగు'"></span>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="max-w-5xl mx-auto px-4 py-12 text-center">
    <span class="inline-block text-xs font-bold text-emerald-400 mb-3"
          x-text="t('govt_backed')"></span>

    <h2 class="text-3xl md:text-4xl font-extrabold mb-4"
        x-text="t('site_title')"></h2>

    <p class="text-slate-300 max-w-2xl mx-auto text-sm md:text-base"
       x-text="t('site_subtitle')"></p>

    <p class="mt-4 text-xs text-slate-400"
       x-text="t('site_note')"></p>
  </section>

  <!-- CATEGORIES -->
  <section class="max-w-6xl mx-auto px-4 py-6">
    <p class="text-sm text-slate-400 mb-4 text-center"
       x-text="t('category_help')"></p>

    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-sm">
      <div class="border border-white/10l10 rounded p-3 text-center">
        👴 <div class="font-semibold" x-text="t('cat_senior')"></div>
        <div class="text-xs text-slate-400" x-text="t('cat_senior_desc')"></div>
      </div>

      <div class="border border-white/10 rounded p-3 text-center">
        👧 <div class="font-semibold" x-text="t('cat_girl')"></div>
        <div class="text-xs text-slate-400" x-text="t('cat_girl_desc')"></div>
      </div>

      <div class="border border-white/10 rounded p-3 text-center">
        💰 <div class="font-semibold" x-text="t('cat_income')"></div>
        <div class="text-xs text-slate-400" x-text="t('cat_income_desc')"></div>
      </div>

      <div class="border border-white/10 rounded p-3 text-center">
        🧾 <div class="font-semibold" x-text="t('cat_tax')"></div>
        <div class="text-xs text-slate-400" x-text="t('cat_tax_desc')"></div>
      </div>

      <div class="border border-white/10 rounded p-3 text-center">
        🪙 <div class="font-semibold" x-text="t('cat_general')"></div>
        <div class="text-xs text-slate-400" x-text="t('cat_general_desc')"></div>
      </div>
    </div>
  </section>

  <!-- SCHEMES -->
  <main class="max-w-7xl mx-auto px-4 py-10">
    <h3 class="text-xl font-bold mb-6 border-l-4 border-red-600 pl-3"
        x-text="t('our_schemes')"></h3>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <template x-for="scheme in schemes" :key="scheme.id">
        <div @click="openModal(scheme)"
             class="border border-white/10 rounded-xl p-5 cursor-pointer hover:bg-white/5 transition">
          <h4 class="font-bold text-lg mb-1" x-text="scheme.title"></h4>
          <p class="text-sm text-slate-400 mb-2" x-text="scheme.desc"></p>
          <p class="text-xs text-emerald-400 font-semibold"
             x-text="scheme.tag"></p>
        </div>
      </template>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-950 border-t border-white/10 mt-16">
    <div class="max-w-7xl mx-auto px-4 py-8 text-sm text-slate-400">
      <p>
        Opposite Pillar No.150, PVNR Expressway, Attapur, Hyderabad – 500048
      </p>
      <p class="mt-2 text-xs">
        A Unit of Department of Posts | Developed by GN Prakash Reddy (Hyderguda S.O.)
      </p>
    </div>
  </footer>

  <!-- MODAL -->
  <div x-show="isModalOpen" style="display:none"
       class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">

    <div class="bg-slate-900 max-w-lg w-full rounded-xl p-6 border border-white/10">
      <button @click="closeModal()" class="float-right text-slate-400">✕</button>

      <h3 class="text-xl font-bold mb-2" x-text="activeScheme?.title"></h3>
      <p class="text-sm text-slate-400 mb-4" x-text="activeScheme?.desc"></p>

      <label class="text-xs font-bold" x-text="t('input_amount')"></label>
      <input type="number" x-model="calcInput"
             @input="validateAndCalculate()"
             class="w-full mt-1 p-2 rounded bg-slate-800 border border-white/10">

      <p class="text-xs text-red-400 mt-1" x-text="limitError"></p>

      <div class="mt-4 text-sm">
        <p class="font-semibold" x-text="calcResult.displayLabel"></p>
        <p class="text-lg font-bold text-emerald-400"
           x-text="calcResult.displayValue"></p>
        <p class="text-xs text-slate-400 mt-2"
           x-text="summaryText"></p>
      </div>

      <p class="text-xs text-slate-400 mt-4"
         x-text="t('visit_po')"></p>
    </div>
  </div>

</div>

<script>
function postOfficeApp() {
  return {
    lang: 'en',
    isModalOpen: false,
    activeScheme: null,
    calcInput: 1000,
    limitError: '',
    calcResult: { displayLabel: '', displayValue: '' },
    summaryText: '',

    translations: {
      en: {
        govt_backed: "✔ Government of India Backed Savings Schemes",
        site_title: "India Post Savings Schemes",
        site_subtitle: "Understand schemes clearly and visit Hyderguda Post Office with confidence.",
        site_note: "No agents • No market risk • Official information only",
        category_help: "Choose a category to find suitable savings schemes",
        cat_senior: "Senior Citizens",
        cat_senior_desc: "For age 60 years & above",
        cat_girl: "Girl Child",
        cat_girl_desc: "Savings for daughter’s future",
        cat_income: "Monthly Income",
        cat_income_desc: "Regular income schemes",
        cat_tax: "Tax Saving",
        cat_tax_desc: "Government approved options",
        cat_general: "General Savings",
        cat_general_desc: "Simple & safe savings",
        our_schemes: "Our Savings Schemes",
        input_amount: "Investment Amount (₹)",
        visit_po: "For exact details, please visit the Post Office."
      },
      te: {
        govt_backed: "✔ ప్రభుత్వం మద్దతు ఉన్న పొదుపు పథకాలు",
        site_title: "ఇండియా పోస్ట్ సేవింగ్స్ పథకాలు",
        site_subtitle: "పథకాలను సులభంగా అర్థం చేసుకొని పోస్టాఫీసును ధైర్యంగా సందర్శించండి.",
        site_note: "ఏజెంట్లు లేరు • మార్కెట్ ప్రమాదం లేదు • అధికారిక సమాచారం మాత్రమే",
        category_help: "మీకు సరైన పొదుపు పథకాన్ని ఎంచుకోండి",
        cat_senior: "వృద్ధ పౌరులు",
        cat_senior_desc: "60 సంవత్సరాలు పైబడిన వారికి",
        cat_girl: "బాలికల కోసం",
        cat_girl_desc: "కుమార్తె భవిష్యత్తు కోసం",
        cat_income: "నెలవారీ ఆదాయం",
        cat_income_desc: "క్రమం తప్పకుండా వచ్చే ఆదాయం",
        cat_tax: "పన్ను ఆదా",
        cat_tax_desc: "ప్రభుత్వ అనుమతితో",
        cat_general: "సాధారణ పొదుపు",
        cat_general_desc: "సురక్షిత పొదుపు మార్గాలు",
        our_schemes: "మా పొదుపు పథకాలు",
        input_amount: "పెట్టే మొత్తం (₹)",
        visit_po: "ఖచ్చితమైన వివరాల కోసం మీ సమీప పోస్టాఫీసును సందర్శించండి."
      }
    },

    schemes: [
      { id: 'SCSS', title: 'Senior Citizen Savings Scheme', desc: 'Regular quarterly income for senior citizens', tag: 'Quarterly Income' },
      { id: 'SSY', title: 'Sukanya Samriddhi Yojana', desc: 'Long-term savings for girl child', tag: 'Tax Free' },
      { id: 'RD', title: 'Recurring Deposit', desc: 'Monthly savings for 5 years', tag: 'Monthly Savings' },
      { id: 'PPF', title: 'Public Provident Fund', desc: 'Long-term tax-free savings', tag: 'Tax Free' },
      { id: 'MIS', title: 'Monthly Income Scheme', desc: 'Fixed monthly income', tag: 'Monthly Income' },
      { id: 'NSC', title: 'National Savings Certificate', desc: '5-year fixed term savings', tag: 'Tax Saving' },
      { id: 'TD', title: 'Time Deposit (5 Years)', desc: 'Fixed deposit with government backing', tag: 'Fixed Term' },
      { id: 'KVP', title: 'Kisan Vikas Patra', desc: 'Amount doubles over fixed period', tag: 'Double Amount' }
    ],

    toggleLang() { this.lang = this.lang === 'en' ? 'te' : 'en'; },
    t(key) { return this.translations[this.lang][key] || key; },
    openModal(s) { this.activeScheme = s; this.isModalOpen = true; },
    closeModal() { this.isModalOpen = false; }
  }
}
</script>

</body>
</html>
